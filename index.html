<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explora Rolling NFT: una colección exclusiva de piezas únicas inspiradas en la cultura gamer y la vida digital."
    />
    <meta
      name="keywords"
      content="Rolling NFT, colección NFT, crypto art, NFTs gamer, cultura digital, arte digital único."
    />
    <meta
      name="author"
      content="Pilar Molina, Agustin Penza, Jose abella, Facundo Vallejo"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="shortcut icon"
      href="./assets/img/logo_rolling_nft.png"
      type="image/x-icon"
    />
    <title>Rolling NFT</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg">
        <div class="container-fluid header-container">
          <img
            src="./assets/img/logo_rolling_nft.png"
            alt="Logo" 
            width="80px"
            class="d-inline-block align-text-top"
          />
          <a class="navbar-brand" href="index.html">ROLLING NFT</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav nav-underline ms-auto">
              <li class="nav-item">
                <a class="nav-link active" href="#">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Coleccion</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Sobre el proyecto</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Contacto</a>
              </li>
            </ul>
            <div class="d-flex">
              <button class="btn btn-wallet" type="button">
                Conectar Wallet
              </button>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main>
  <div class="container my-5">
    <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">  
        <div class="carousel-item active">
          <img src="./assets/img/logo_carrouselNFT.png" class="d-block w-100" alt="logo carousel perro">
          <a href="#" class="btn-dino-flotante">Explorar Colección →</a>
        </div>
        <div class="carousel-item">
          <img src="./assets/img/cat-caroussel-2.png" class="d-block w-100" alt="gato carousel 2">
          <a href="#" class="btn-dino-flotante">Explorar Colección →</a>
        </div>
        <div class="carousel-item">
          <img src="./assets/img/dino-SinBoton-carousel.png" class="d-block w-100" alt="dino carousel 3">
          <a href="#" class="btn-dino-flotante">Explorar Colección →</a>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  </div>
</main>
    <footer></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
